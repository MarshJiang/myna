name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cargo \
            debhelper-compat \
            libglib2.0-dev \
            libgtk-3-dev \
            librime-dev \
            libsystemd-dev \
            libwayland-dev \
            libxkbcommon-dev \
            meson \
            ninja-build \
            pkg-config \
            rustc \
            wayland-protocols

      - name: Prefer the distribution Rust toolchain
        run: |
          echo "/usr/bin" >> "$GITHUB_PATH"
          echo "RUSTC=/usr/bin/rustc" >> "$GITHUB_ENV"
          echo "CARGO=/usr/bin/cargo" >> "$GITHUB_ENV"
          /usr/bin/rustc --version
          /usr/bin/cargo --version

      - name: Run Rust tests
        run: cargo test

      - name: Configure and build with Meson
        run: |
          meson setup build --buildtype=release
          meson compile -C build

      - name: Build Debian package
        run: dpkg-buildpackage --build=binary --no-sign

      - name: Collect Debian packages
        run: |
          mkdir -p deb-artifacts
          cp ../*.deb deb-artifacts/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: myna-osk-deb-${{ matrix.arch }}
          path: deb-artifacts/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: myna-osk-deb-*
          merge-multiple: true
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*.deb
